<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Clone Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F9F9F8] text-stone-800 h-screen flex flex-col overflow-hidden font-sans">
  <!-- Topo Mobile -->
  <header class="p-3 bg-white border-b border-stone-200 flex flex-col gap-2">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-1.5">
        <span class="text-amber-600 font-bold text-lg">✦</span>
        <h1 class="font-serif font-semibold text-base">Claude Cloud Mobile</h1>
      </div>
      <div class="flex bg-stone-200 p-0.5 rounded-lg text-xs font-medium">
        <button onclick="switchTab('chat')" id="btnChat" class="px-3 py-1 rounded-md bg-white shadow-sm">Chat</button>
        <button onclick="switchTab('artifact')" id="btnArt" class="px-3 py-1 rounded-md text-stone-600">Artifact ✨</button>
      </div>
    </div>
    <div class="flex gap-2">
      <input id="apiKey" type="password" placeholder="Chave GROQ (gsk_...)" 
        class="text-xs p-2 border border-stone-300 rounded-lg flex-1 bg-stone-50" />
      <select id="modelSelect" class="text-xs p-2 border border-stone-300 rounded-lg bg-stone-50 max-w-[150px] truncate">
        <option value="">Auto (Detetar modelo)</option>
      </select>
    </div>
  </header>

  <!-- Aba 1: Chat -->
  <div id="tabChat" class="flex-1 flex flex-col overflow-hidden">
    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 font-serif text-sm">
      <div class="text-stone-500 text-center mt-10">
        <p class="text-lg text-stone-800 mb-1">Como posso ajudar hoje?</p>
        <p class="text-xs font-sans">O sistema escolhe automaticamente o melhor modelo disponível na sua chave Groq!</p>
      </div>
    </div>
    <form id="chatForm" class="p-3 bg-white border-t border-stone-200 flex gap-2">
      <input id="userInput" type="text" placeholder="Peça um app, calculadora ou jogo..." 
        class="flex-1 p-3 rounded-xl border border-stone-300 bg-[#F9F9F8] font-sans text-sm" required />
      <button type="submit" class="px-4 py-3 bg-amber-700 text-white rounded-xl text-sm font-medium">Enviar</button>
    </form>
  </div>

  <!-- Aba 2: Artifact -->
  <div id="tabArtifact" class="hidden flex-1 flex flex-col bg-white overflow-hidden">
    <iframe id="previewFrame" class="flex-1 w-full h-full border-0"></iframe>
  </div>

  <script>
    const SYSTEM_PROMPT = `És um assistente estilo Claude. Sempre que o utilizador pedir uma interface, calculadora, jogo ou página, responde com uma breve explicação e coloca TODO o código HTML+CSS(Tailwind)+JS funcional dentro da tag <antArtifact>...</antArtifact>. Não uses blocos markdown dentro da tag, apenas o código HTML completo iniciando com <!DOCTYPE html>.`;

    const apiKeyInput = document.getElementById('apiKey');
    const modelSelect = document.getElementById('modelSelect');

    apiKeyInput.value = localStorage.getItem('groq_key') || '';

    async function loadModels() {
      const key = apiKeyInput.value.replace(/\s+/g, '');
      if (!key.startsWith('gsk_')) return;
      try {
        const res = await fetch('https://api.groq.com/openai/v1/models', {
          headers: { 'Authorization': 'Bearer ' + key }
        });
        const data = await res.json();
        if (data.data && Array.isArray(data.data)) {
          // Filtra modelos de texto/chat (ignora modelos de áudio/whisper/guard)
          const chatModels = data.data
            .map(m => m.id)
            .filter(id => !id.includes('whisper') && !id.includes('guard') && !id.includes('tts'));
          
          if (chatModels.length > 0) {
            modelSelect.innerHTML = chatModels.map(id => `<option value="${id}">${id}</option>`).join('');
            // Dá preferência a modelos Llama ou Qwen ou DeepSeek mais potentes se existirem
            const preferred = chatModels.find(id => id.includes('llama') || id.includes('qwen') || id.includes('deepseek')) || chatModels[0];
            modelSelect.value = preferred;
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('groq_key', apiKeyInput.value.trim());
      loadModels();
    });

    if (apiKeyInput.value) loadModels();

    function switchTab(tab) {
      const isChat = tab === 'chat';
      document.getElementById('tabChat').classList.toggle('hidden', !isChat);
      document.getElementById('tabArtifact').classList.toggle('hidden', isChat);
      document.getElementById('btnChat').className = isChat ? 'px-3 py-1 rounded-md bg-white shadow-sm' : 'px-3 py-1 rounded-md text-stone-600';
      document.getElementById('btnArt').className = !isChat ? 'px-3 py-1 rounded-md bg-amber-600 text-white shadow-sm' : 'px-3 py-1 rounded-md text-stone-600';
    }

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const apiKey = apiKeyInput.value.replace(/\s+/g, '');
      if (!apiKey.startsWith('gsk_')) {
        return alert('Atenção: Cole a sua chave começada por gsk_ na caixa de cima!');
      }

      if (!modelSelect.value) {
        await loadModels();
      }
      const chosenModel = modelSelect.value || 'llama3-8b-8192';

      const input = document.getElementById('userInput');
      const prompt = input.value.trim();
      input.value = '';

      const msgContainer = document.getElementById('messages');
      msgContainer.innerHTML += `<div class="bg-stone-200 p-3 rounded-2xl ml-auto max-w-[85%] font-sans text-xs">${prompt}</div>`;
      
      const botDiv = document.createElement('div');
      botDiv.className = 'bg-white border border-stone-200 p-3.5 rounded-2xl max-w-[90%] shadow-sm whitespace-pre-wrap text-sm';
      botDiv.textContent = `A criar com ${chosenModel}...`;
      msgContainer.appendChild(botDiv);
      msgContainer.scrollTop = msgContainer.scrollHeight;

      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + apiKey
          },
          body: JSON.stringify({
            model: chosenModel,
            messages: [
              { role: 'system', content: SYSTEM_PROMPT },
              { role: 'user', content: prompt }
            ]
          })
        });

        const data = await res.json();
        if (!res.ok || data.error) {
          botDiv.textContent = 'Detalhe do erro da API: ' + (data.error?.message || res.statusText);
          return;
        }

        const reply = data.choices?.[0]?.message?.content || 'Sem resposta.';
        const match = reply.match(/<antArtifact>([\s\S]*?)<\/antArtifact>/);
        if (match) {
          document.getElementById('previewFrame').srcdoc = match[1].trim();
          botDiv.innerHTML = reply.replace(/<antArtifact>[\s\S]*?<\/antArtifact>/, '') + 
            `<br><button onclick="switchTab('artifact')" class="mt-2 w-full py-2.5 bg-amber-100 text-amber-900 rounded-lg font-sans text-xs font-bold">▶ Tocar para abrir o App criado (Artifact ✨)</button>`;
        } else {
          botDiv.textContent = reply;
        }
      } catch (err) {
        botDiv.textContent = 'Erro de ligação: ' + err.message;
      }
    });
  </script>
</body>
</html>
